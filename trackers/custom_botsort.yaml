# BoT-SORT tuned for slower effective processing fps (busy multi-person scenes):
# default track_buffer=30 assumes near-native-fps processing; we raise it so a
# person isn't handed a brand-new ID after a brief detection gap or occlusion.
# Everything else matches ultralytics/cfg/trackers/botsort.yaml defaults.

tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 60
match_thresh: 0.8
fuse_score: True

gmc_method: sparseOptFlow

proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
